name: Integration Workflow

on:
  push:
    branches: [beta, legacy]
  pull_request:
    branches: [beta, legacy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
      - run: npm i
      - run: npm run build
      - run: npm run lint
