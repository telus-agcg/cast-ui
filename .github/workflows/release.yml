name: Release Workflow

on:
  push:
    branches: [master, beta, next]

permissions:
  contents: write
  pages: write
  id-token: write

# Releases must never overlap or be cancelled mid-flight: a run that is killed
# between tagging and publishing leaves a tag with no npm package behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Trusted Publisher)
        run: |
          # @semantic-release/npm runs with npmPublish:false, so the version it
          # resolved exists only in the workspace. If semantic-release decided
          # not to release, package.json still holds the committed version,
          # which is already on the registry -- skip rather than fail.
          VERSION=$(node -p "require('./package.json').version")
          case "${{ github.ref_name }}" in
            master) TAG=latest ;;
            # Prerelease branches publish under a dist-tag named for the branch,
            # matching semantic-release's default channel convention.
            *) TAG="${{ github.ref_name }}" ;;
          esac
          if npm view "@tkxs/cast-ui@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already published; nothing to do."
            exit 0
          fi
          echo "Publishing $VERSION under dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"

      - name: Build Static Asset
        run: npm run build-static

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Release Pages Artifact
    if: github.ref_name == 'master'
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
